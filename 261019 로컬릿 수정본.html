<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOCALIT · Archive</title>
<style>

uted);margin:3px}.entry{width:100%;display:flex;padding:10px;gap:12px;margin:9px 0;align-items:center}.thumb{width:74px;height:73px;flex-shrink:0;border-radius:8px;background:var(--sage);display:grid;place-items:center;font-size:24px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.entry strong{font-size:14px}.entry p{font-size:12px;color:var(--muted);margin:6px 0}.fab{position:fixed;bottom:89px;left:calc(50% + 132px);border:0;background:var(--green);color:white;width:48px;height:48px;border-radius:50%;font-size:29px;box-shadow:0 4px 13px #0002;z-index:5}.nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:13px 0 17px}.nav button{background:none;border:0;color:#8b9a90;font-size:12px}.nav .active{color:var(--green);font-weight:bold}.nav span{display:block;font-size:20px;margin-bottom:4px}.screen{display:none}.screen.active{display:block}.paper{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:20px}.cover{width:100%;height:220px;object-fit:cover;border-radius:10px;background:var(--sage)}.placeholder{height:220px;background:var(--sage);display:grid;place-items:center;color:var(--green);border-radius:10px;font-size:45px}.detailhead{display:flex;justify-content:space-between;align-items:center;position:relative}.menu{position:absolute;right:0;top:38px;background:white;box-shadow:0 6px 24px #0002;border:1px solid var(--line);border-radius:10px;z-index:3;min-width:125px;overflow:hidden}.menu button{display:block;border:0;background:white;width:100%;padding:12px;text-align:left;color:var(--ink)}.menu button:hover{background:var(--bg)}.menu .danger{color:#b34d42}.diarytext{white-space:pre-wrap;line-height:1.8;font-size:14px}.field{display:block;margin:17px 0 6px;font-size:12px;font-weight:bold;color:var(--green)}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd7c9;background:white;border-radius:9px;color:var( </style></head><body><main class="app">
<header class="top"><span>LOCALIT.</span><button aria-label="홈으로" onclick="go('home')">✳</button></header>
<section class="screen active" id="home"><div class="eyebrow">MY LITTLE LOCAL DIARY</div><h1 class="heading">나의 로컬 아카이브</h1><p class="sub">내가 걸어온 동네, 내가 모은 이야기.</p><div class="hero"><small>MY LOCAL JOURNEY</small><h2>나의 발자취</h2><div class="stats"><div><b id="count">0</b><span>방문 기록</span></div><div><b id="regions">0</b><span>탐험한 지역</span></div></div></div><div class="section"><h3>나의 지역 컬렉션</h3><button class="link" onclick="go('albums')">전체보기 →</button></div><div class="albums" id="homeAlbums"></div><div class="section"><h3>최근의 기록</h3><button class="link" onclick="go('albums')">더보기 →</button></div><div id="recent"></div></section>
<section class="screen" id="albums"><button class="back" onclick="go('home')">‹</button><div class="eyebrow">LOCAL COLLECTION</div><h1 class="heading">지역별 앨범</h1><p class="sub">동네마다 쌓인 나만의 추억을 펼쳐보세요.</p><div class="albums" id="allAlbums"></div></section>
<section class="screen" id="region"><button class="back" onclick="go('albums')">‹</button><div class="eyebrow">MY LOCAL COLLECTION</div><h1 class="heading" id="regionTitle"></h1><p class="sub" id="regionSub"></p><div id="regionEntries"></div></section>
<section class="screen" id="detail"><button class="back" onclick="go('home')">‹</button><div class="paper"><div class="detailhead"><div class="eyebrow" id="detailRegion" style="margin:0"></div><button class="dots" aria-label="더보기" onclick="toggleMenu()">⋮</button><div class="menu" id="moreMenu" hidden><button onclick="editEntry()">✎ 수정하기</button><button class="danger" onclick="deleteEntry()">♧ 삭제하기</button></div></div><h1 class="heading" id="detailTitle"></h1><p class="sub" id="detailMeta"></p><div id="detailPhoto"></div><p class="diarytext" id="detailText"></p></div></section>
<section class="screen" id="editor"><button class="back" onclick="go('home')">‹</button><div class="eyebrow">WRITE YOUR STORY</div><h1 class="heading" id="editorHeading">새로운 기록</h1><p class="sub">오늘 발견한 동네의 이야기를 남겨보세요.</p><form id="diaryForm"><label class="field" for="area">지역</label><select id="province" required><option value="">시·도를 선택하세요</option></select><label class="field" for="area">시·군·구</label><select id="area" required disabled><option value="">먼저 시·도를 선택하세요</option></select><label class="field" for="place">방문 장소</label><input id="place" placeholder="예: 동네 작은 카페" required maxlength="80"><label class="field" for="date">방문 날짜</label><input id="date" type="date" required><label class="field" for="diaryTitle">일기 제목</label><input id="diaryTitle" required maxlength="100" placeholder="오늘 발견한 작은 이야기"><label class="field" for="photo">사진 (선택)</label><input id="photo" type="file" accept="image/*"><div id="photoPreview"></div><label class="field" for="memo">오늘의 기록</label><textarea id="memo" required placeholder="어떤 순간이 기억에 남았나요?"></textarea><button class="primary" type="submit" id="saveButton">아카이브에 저장하기</button></form></section>
<section class="screen" id="calendar"><button class="back" onclick="go('home')">‹</button><div class="eyebrow">MEMORY CALENDAR</div><h1 class="heading">기록 달력</h1><div class="section"><button class="secondary" onclick="shiftMonth(-1)">‹</button><h3 id="monthLabel"></h3><button class="secondary" onclick="shiftMonth(1)">›</button></div><div class="calendar" id="calendarGrid"></div><div class="section"><h3 id="selectedLabel">이날의 기록</h3></div><div id="dayEntries"></div></section>
<button class="fab" id="addButton" aria-label="새 일기 작성" onclick="newEntry()">+</button><nav class="nav"><button onclick="go('home')"><span>⌂</span>홈</button><button onclick="go('albums')"><span>▤</span>앨범</button><button class="active" onclick="go('calendar')"><span>▦</span>달력</button><button onclick="newEntry()"><span>✎</span>기록</button></nav></main>
<script>
const REGION_OPTIONS={"서울특별시": ["종로구", "중구", "용산구", "성동구", "광진구", "동대문구", "중랑구", "성북구", "강북구", "도봉구", "노원구", "은평구", "서대문구", "마포구", "양천구", "강서구", "구로구", "금천구", "영등포구", "동작구", "관악구", "서초구", "강남구", "송파구", "강동구"], "부산광역시": ["중구", "서구", "동구", "영도구", "부산진구", "동래구", "남구", "북구", "해운대구", "사하구", "금정구", "강서구", "연제구", "수영구", "사상구", "기장군"], "대구광역시": ["중구", "동구", "서구", "남구", "북구", "수성구", "달서구", "달성군", "군위군"], "인천광역시": ["중구", "동구", "미추홀구", "연수구", "남동구", "부평구", "계양구", "서구", "강화군", "옹진군"], "광주광역시": ["동구", "서구", "남구", "북구", "광산구"], "대전광역시": ["동구", "중구", "서구", "유성구", "대덕구"], "울산광역시": ["중구", "남구", "동구", "북구", "울주군"], "세종특별자치시": ["세종특별자치시"], "경기도": ["수원시", "성남시", "의정부시", "안양시", "부천시", "광명시", "평택시", "동두천시", "안산시", "고양시", "과천시", "구리시", "남양주시", "오산시", "시흥시", "군포시", "의왕시", "하남시", "용인시", "파주시", "이천시", "안성시", "김포시", "화성시", "광주시", "양주시", "포천시", "여주시", "연천군", "가평군", "양평군"], "강원특별자치도": ["춘천시", "원주시", "강릉시", "동해시", "태백시", "속초시", "삼척시", "홍천군", "횡성군", "영월군", "평창군", "정선군", "철원군", "화천군", "양구군", "인제군", "고성군", "양양군"], "충청북도": ["청주시", "충주시", "제천시", "보은군", "옥천군", "영동군", "증평군", "진천군", "괴산군", "음성군", "단양군"], "충청남도": ["천안시", "공주시", "보령시", "아산시", "서산시", "논산시", "계룡시", "당진시", "금산군", "부여군", "서천군", "청양군", "홍성군", "예산군", "태안군"], "전북특별자치도": ["전주시", "군산시", "익산시", "정읍시", "남원시", "김제시", "완주군", "진안군", "무주군", "장수군", "임실군", "순창군", "고창군", "부안군"], "전라남도": ["목포시", "여수시", "순천시", "나주시", "광양시", "담양군", "곡성군", "구례군", "고흥군", "보성군", "화순군", "장흥군", "강진군", "해남군", "영암군", "무안군", "함평군", "영광군", "장성군", "완도군", "진도군", "신안군"], "경상북도": ["포항시", "경주시", "김천시", "안동시", "구미시", "영주시", "영천시", "상주시", "문경시", "경산시", "의성군", "청송군", "영양군", "영덕군", "청도군", "고령군", "성주군", "칠곡군", "예천군", "봉화군", "울진군", "울릉군"], "경상남도": ["창원시", "진주시", "통영시", "사천시", "김해시", "밀양시", "거제시", "양산시", "의령군", "함안군", "창녕군", "고성군", "남해군", "하동군", "산청군", "함양군", "거창군", "합천군"], "제주특별자치도": ["제주시", "서귀포시"]};
const DB='localit-archive-v1',STORE='diaries';let db,entries=[],currentId=null,editingId=null,returnRegion=null,chosenPhoto=null,calMonth=new Date(),selectedDate='';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setupRegions(){ $('province').innerHTML='<option value="">시·도를 선택하세요</option>'+Object.keys(REGION_OPTIONS).map(x=>`<option value="${x}">${x}</option>`).join('');$('province').onchange=()=>setCities('') }
function setCities(selected){const province=$('province').value, options=REGION_OPTIONS[province]||[];$('area').disabled=!province;$('area').innerHTML='<option value="">시·군·구를 선택하세요</option>'+options.map(x=>`<option value="${x}">${x}</option>`).join('');$('area').value=selected||''}
function request(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function init(){setupRegions();db=await new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});await refresh();go('home')}
function store(mode){return db.transaction(STORE,mode).objectStore(STORE)}
async function refresh(){entries=(await request(store('readonly').getAll())).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);renderHome();renderAlbums();renderCalendar()}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));$('addButton').style.display=id==='editor'?'none':'block';if(id==='calendar')renderCalendar();window.scrollTo(0,0)}
function groups(){return [...new Set(entries.map(e=>e.area))]}
function albumCard(area){const list=entries.filter(e=>e.area===area),photo=list.find(e=>e.photo)?.photo;return `<button class="album" data-area="${esc(area)}"><div class="album-art">${photo?`<img src="${photo}" alt="">`:'✿'}</div><strong>${esc(area)}</strong><small>${list.length}개의 추억</small></button>`}
function bindAlbums(container){container.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>showRegion(b.dataset.area))}
function entryCard(e){return `<button class="entry" data-id="${e.id}"><div class="thumb">${e.photo?`<img src="${e.photo}" alt="">`:'✿'}</div><div><strong>${esc(e.title)}</strong><p>${esc(e.place)} · ${esc(e.date)}</p><small>${esc(e.memo.slice(0,35))}${e.memo.length>35?'…':''}</small></div></button>`}
function bindEntries(container){container.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>showDetail(Number(b.dataset.id)))}
function fillEntries(id,list){$(id).innerHTML=list.length?list.map(entryCard).join(''):'<div class="empty">아직 기록이 없어요.<br>첫 번째 동네 이야기를 남겨보세요 ✎</div>';bindEntries($(id))}
function renderHome(){$('count').textContent=entries.length;$('regions').textContent=groups().length;$('homeAlbums').innerHTML=groups().slice(0,2).map(albumCard).join('')||'<div class="empty" style="grid-column:span 2">아직 앨범이 없어요.<br>새 기록을 남기면 지역 앨범이 생겨요.</div>';bindAlbums($('homeAlbums'));fillEntries('recent',entries.slice(0,3))}
function renderAlbums(){$('allAlbums').innerHTML=groups().map(albumCard).join('')||'<div class="empty" style="grid-column:span 2">기록을 추가하면 지역별 앨범이 생겨요.</div>';bindAlbums($('allAlbums'))}
function showRegion(area){returnRegion=area;$('regionTitle').textContent=area;const list=entries.filter(e=>e.area===area);$('regionSub').textContent=`${list.length}개의 기록을 모았어요.`;fillEntries('regionEntries',list);go('region')}
function showDetail(id){const e=entries.find(x=>x.id===id);if(!e)return;currentId=id;$('moreMenu').hidden=true;$('detailRegion').textContent=e.area.toUpperCase()+' · LOCAL DIARY';$('detailTitle').textContent=e.title;$('detailMeta').textContent=e.date+'  |  '+e.place;$('detailPhoto').innerHTML=e.photo?`<img class="cover" src="${e.photo}" alt="방문 사진">`:'<div class="placeholder">✿</div>';$('detailText').textContent=e.memo;go('detail')}
function toggleMenu(){$('moreMenu').hidden=!$('moreMenu').hidden}
function newEntry(){editingId=null;chosenPhoto=null;$('diaryForm').reset();setCities('');$('date').value=new Date().toLocaleDateString('sv-SE');$('photoPreview').innerHTML='';$('editorHeading').textContent='새로운 기록';$('saveButton').textContent='아카이브에 저장하기';go('editor')}
function editEntry(){const e=entries.find(x=>x.id===currentId);if(!e)return;editingId=e.id;chosenPhoto=e.photo||null;const province=e.province||Object.keys(REGION_OPTIONS).find(k=>REGION_OPTIONS[k].includes(e.area))||'';$('province').value=province;setCities(e.area);$('place').value=e.place;$('date').value=e.date;$('diaryTitle').value=e.title;$('memo').value=e.memo;$('photo').value='';preview();$('editorHeading').textContent='기록 수정하기';$('saveButton').textContent='수정 내용 저장하기';go('editor')}
async function deleteEntry(){$('moreMenu').hidden=true;if(!confirm('이 일기를 삭제할까요? 삭제한 기록은 되돌릴 수 없어요.'))return;await request(store('readwrite').delete(currentId));currentId=null;await refresh();go('home')}
function preview(){$('photoPreview').innerHTML=chosenPhoto?`<img class="preview" src="${chosenPhoto}" alt="첨부 사진"><button type="button" class="secondary" id="removePhoto">사진 제거</button>`:'';if($('removePhoto'))$('removePhoto').onclick=()=>{chosenPhoto=null;$('photo').value='';preview()}}
$('photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>12*1024*1024){alert('12MB 이하 사진을 선택해 주세요.');e.target.value='';return}const img=new Image(),url=URL.createObjectURL(f);try{await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const scale=Math.min(1,1100/img.width,1100/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);chosenPhoto=c.toDataURL('image/jpeg',.76);preview()}catch{alert('사진을 불러올 수 없어요.')}finally{URL.revokeObjectURL(url)}};
$('diaryForm').onsubmit=async ev=>{ev.preventDefault();const e={id:editingId??Date.now(),province:$('province').value,area:$('area').value.trim(),place:$('place').value.trim(),date:$('date').value,title:$('diaryTitle').value.trim(),memo:$('memo').value.trim(),photo:chosenPhoto};if(!e.province||!e.area||!e.place||!e.title||!e.memo)return;try{await request(store('readwrite').put(e));await refresh();showDetail(e.id)}catch(err){alert('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.')}};
function shiftMonth(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);selectedDate='';renderCalendar()}
function renderCalendar(){const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('monthLabel').textContent=`${y}. ${String(m+1).padStart(2,'0')}`;let h=['일','월','화','수','목','금','토'].map(x=>`<div class="week">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;h+=`<button class="day ${entries.some(e=>e.date===date)?'has':''} ${selectedDate===date?'selected':''}" data-date="${date}">${d}${entries.some(e=>e.date===date)?' •':''}</button>`}$('calendarGrid').innerHTML=h;$('calendarGrid').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;renderCalendar()});$('selectedLabel').textContent=selectedDate?selectedDate+'의 기록':'날짜를 선택해 주세요';fillEntries('dayEntries',selectedDate?entries.filter(e=>e.date===selectedDate):[])}
init().catch(()=>alert('이 브라우저에서는 기록 저장 기능을 시작할 수 없어요. 다른 최신 브라우저를 사용해 주세요.'));
</script></body></html>
